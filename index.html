<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e53935">
<meta name="description" content="Visit Pip's World: explore rescue vehicles, play games and collect stickers with Pip the pup. For ages 4 to 6. Works offline.">
<title>Pip's World</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
  <div id="scene"></div>
  <div id="fx-layer"></div>
  <canvas id="confetti"></canvas>

  <!-- Pip and the speech bubble -->
  <div id="pip-dock">
    <button id="pip" class="pip-btn" aria-label="Pip the pup"></button>
    <div id="bubble" hidden></div>
  </div>

  <!-- Buttons around the edge -->
  <button id="btn-home" class="ui-btn" aria-label="Home" hidden>
    <svg viewBox="0 0 64 64"><path d="M10 32 L32 12 L54 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 30 V52 H28 V40 H36 V52 H46 V30" fill="#fff"/></svg>
  </button>
  <button id="btn-map" class="ui-btn" aria-label="Pip's map" hidden>
    <svg viewBox="0 0 64 64"><path d="M8 16 L22 10 L42 16 L56 10 V48 L42 54 L22 48 L8 54 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M22 10 V48 M42 16 V54" stroke="#f07a1a" stroke-width="3"/><path d="M14 40 Q24 30 32 36 T50 24" fill="none" stroke="#e53935" stroke-width="3" stroke-dasharray="4 3"/></svg>
  </button>
  <button id="btn-repeat" class="ui-btn" aria-label="Say that again">
    <svg viewBox="0 0 64 64"><path d="M12 24 H22 L34 14 V50 L22 40 H12 Z" fill="#fff"/><path d="M42 22 Q50 32 42 42 M48 16 Q60 32 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
  </button>
  <button id="btn-stickers" class="ui-btn" aria-label="Sticker book" hidden>
    <svg viewBox="0 0 64 64"><path d="M32 8 L39 24 L56 25 L43 36 L47 53 L32 44 L17 53 L21 36 L8 25 L25 24 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
    <span id="sticker-count" class="count" hidden>0</span>
  </button>
  <button id="btn-games" class="ui-btn" aria-label="Games" hidden>
    <svg viewBox="0 0 64 64"><path d="M14 22 H26 Q24 12 32 12 Q40 12 38 22 H50 V34 Q60 32 60 40 Q60 48 50 46 V56 H14 V46 Q24 48 24 40 Q24 32 14 34 Z" fill="#fff"/></svg>
  </button>
  <button id="btn-phone" class="ui-btn phone" aria-label="Answer the emergency call" hidden>
    <svg viewBox="0 0 64 64"><path d="M18 10 Q12 10 10 16 Q8 34 26 46 Q40 56 50 54 Q56 52 54 46 L50 40 Q48 36 44 38 L38 42 Q28 36 22 26 L26 20 Q28 16 24 14 Z" fill="#fff"/><text x="44" y="22" font-family="Fredoka, sans-serif" font-weight="700" font-size="15" fill="#fff" text-anchor="middle">999</text></svg>
  </button>
  <button id="btn-grownups" class="grownups" hidden>
    <svg viewBox="0 0 40 40" class="ring"><circle cx="20" cy="20" r="16"/><circle class="fill" cx="20" cy="20" r="16"/></svg>
    <span>Grown-ups</span>
  </button>

  <div id="modal" hidden></div>
  <div id="fade"></div>

  <!-- First screen: a tap is needed before sound can play -->
  <div id="start">
    <div class="start-battenburg"></div>
    <h1>Pip's World</h1>
    <div id="start-pip"></div>
    <button id="btn-play" aria-label="Play">
      <svg viewBox="0 0 64 64"><path d="M22 14 L52 32 L22 50 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Shown only in a browser: install the app, or help when Chrome won't offer it -->
  <button id="btn-install" class="install-pill" hidden>📲 Install app</button>
  <button id="btn-install-help" class="install-pill help" hidden>📲 How to install</button>

  <div id="rotate">
    <svg viewBox="0 0 120 120"><rect x="30" y="20" width="60" height="90" rx="10" fill="none" stroke="#fff" stroke-width="6"/><path d="M98 54 a40 40 0 0 0 -30 -38 M68 8 l2 10 -10 2" fill="none" stroke="#ffd21f" stroke-width="6" stroke-linecap="round"/></svg>
    <p>Turn your tablet sideways to play</p>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/voice.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<script src="js/worlds.js"></script>
<script src="js/vehicles2.js"></script>
<script src="js/vehicles3.js"></script>
<script src="js/match.js"></script>
<script src="js/games.js"></script>
<script src="js/games4.js"></script>
<script src="js/games5.js"></script>
<script src="js/lib/matter.min.js"></script>
<script src="js/ballrun.js"></script>
<script src="js/train.js"></script>
<script src="js/rewards.js"></script>
<script src="js/sorter.js"></script>
<script src="js/story.js"></script>
<script src="js/zoo-art.js"></script>
<script src="js/zoo.js"></script>
<script src="js/monster-art.js"></script>
<script src="js/monsters.js"></script>
</body>
</html>
